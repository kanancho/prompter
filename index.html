<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teleprompter con voz</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b0b0d;--fg:#f4f4f5;--dim:#5b5b63;--hl:#ffd54a;--panel:#17171b;--line:#2a2a31;--btn:#2b6cff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#setup{display:flex;flex-direction:column;gap:12px;padding:16px;height:100%}
h1{font-size:20px;margin:0}
p.s{margin:0;color:#a1a1aa;font-size:14px}
textarea{flex:1;min-height:200px;width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px;line-height:1.4;resize:none}
button,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
button.p{background:var(--btn);border-color:var(--btn);font-weight:600}
button.r{background:#e5322d;border-color:#e5322d;font-weight:600}
a.btn{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#run{display:none;height:100%;flex-direction:column}
#stage{position:relative;flex:0 0 var(--sh,30%);overflow:hidden;border-bottom:1px solid var(--line)}
#scroller{height:100%;overflow-y:scroll;padding:0 12px 60vh;scrollbar-width:none;-webkit-overflow-scrolling:touch;
-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
#scroller::-webkit-scrollbar{display:none}
#text{font-weight:700;line-height:1.3;text-align:center;width:var(--col,70%);margin:0 auto}
#text.camL{margin:0 auto 0 0}
#text.camR{margin:0 0 0 auto}
#text.mirror{transform:scaleX(-1)}
.w{color:var(--fg);cursor:pointer}
.w.done{color:var(--dim)}
.w.cur{color:#000;background:var(--hl);border-radius:6px;padding:0 3px}
#pip{position:absolute;right:8px;bottom:8px;width:84px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:2px solid var(--line);transform:scaleX(-1);display:none;background:#000}
#rectag{position:absolute;left:10px;top:8px;background:#e5322d;color:#fff;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;display:none;z-index:4}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);font-size:20vh;font-weight:800;z-index:5}
#result{display:none;flex-direction:column;gap:8px}
#result video{width:100%;max-height:34vh;border-radius:12px;background:#000}
#ctrl{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
#status{font-size:14px;color:#a1a1aa;min-height:20px}
label{font-size:13px;color:#a1a1aa;display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}
input[type=range]{width:100%}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);flex:0 0 auto;min-width:0}
</style>
</head>
<body>
<div id="setup">
  <h1>Teleprompter con voz</h1>
  <p class="s">Pega tu guion. El texto aparece arriba, junto a la cámara, y avanza según lo que dices.</p>
  <textarea id="script" placeholder="Pega aquí tu guion…"></textarea>
  <div class="row">
    <select id="lang">
      <option value="es-PE">Español (Perú)</option>
      <option value="es-ES">Español (España)</option>
      <option value="es-MX">Español (México)</option>
      <option value="es-US">Español (EE. UU.)</option>
    </select>
    <button class="p" id="go" style="flex:1">Comenzar</button>
  </div>
  <p class="s" id="support"></p>
</div>

<div id="run">
  <div id="stage">
    <div id="scroller"><div id="text"></div></div>
    <video id="pip" muted playsinline></video>
    <div id="rectag">● REC 0:00</div>
    <div id="count"></div>
  </div>
  <div id="ctrl">
    <div id="status">Listo.</div>
    <div class="row">
      <button class="r" id="rec" style="flex:1">● Grabar video</button>
    </div>
    <div class="row">
      <button class="p" id="mic" style="flex:1">🎙 Escuchar</button>
      <button id="auto">▶ Auto</button>
    </div>
    <div class="row">
      <button id="restart">⏮ Inicio</button>
      <button id="back">Editar</button>
      <button id="fs">⛶ Pantalla completa</button>
    </div>
    <div class="row">
      <label>Cuenta regresiva
        <select id="cd"><option value="0">Sin cuenta</option><option value="3" selected>3 segundos</option><option value="5">5 segundos</option><option value="10">10 segundos</option></select>
      </label>
      <label>Tamaño del texto<input type="range" id="size" min="22" max="64" value="30"></label>
    </div>
    <div class="row">
      <label>Look del video
        <select id="look"><option value="natural">Natural</option><option value="bn">Blanco y negro</option><option value="contraste">Contraste</option></select>
      </label>
    </div>
    <div class="row">
      <label>Ancho de columna<input type="range" id="col" min="35" max="100" value="70"></label>
      <label>Alto de la ventana<input type="range" id="sh" min="18" max="50" value="30"></label>
    </div>
    <div class="row">
      <label>Cámara frontal en…<select id="campos"><option value="">Centro</option><option value="camL">Izquierda</option><option value="camR">Derecha</option></select></label>
      <label>Velocidad (modo Auto)<input type="range" id="speed" min="10" max="150" value="40"></label>
      <label class="chk"><input type="checkbox" id="mirror"> Espejo</label>
      <label class="chk"><input type="checkbox" id="seeme"> Ver mi cámara</label>
    </div>
    <div id="result">
      <video id="playback" controls playsinline></video>
      <div class="row">
        <a class="btn" id="dl" style="flex:1">⬇ Descargar video</a>
        <button id="share">Compartir</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let words=[],spans=[],pos=0,rec=null,listening=false,autoOn=false,raf=0,lastT=0,wantListen=false,cdTimer=0;
let stream=null,mr=null,chunks=[],recTimer=0,recStart=0,lastBlob=null,lastName='',lookV=null,lookRaf=0,lookMsg='';

try{const s=localStorage.getItem('tp_script');if(s)$('script').value=s;}catch(e){}
if(!SR)$('support').textContent='Tu navegador no admite reconocimiento de voz. Usa Chrome o Safari, o el modo Auto.';

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ]/g,'');
function status(m){$('status').textContent=m;}

function build(){
  const t=$('text');t.innerHTML='';words=[];spans=[];
  $('script').value.split(/\n/).forEach(line=>{
    line.split(/\s+/).filter(Boolean).forEach(tok=>{
      const sp=document.createElement('span');sp.className='w';sp.textContent=tok+' ';
      const i=words.length;sp.onclick=()=>{pos=i;mark();};
      t.appendChild(sp);words.push(norm(tok));spans.push(sp);
    });
    t.appendChild(document.createElement('br'));
  });
  pos=0;applySize();mark();
}
function applySize(){$('text').style.fontSize=$('size').value+'px';}
function paint(){spans.forEach((s,i)=>{s.className='w'+(i<pos?' done':i===pos?' cur':'');});}
function mark(){
  paint();const s=spans[pos];if(!s)return;
  const sc=$('scroller');
  sc.scrollTo({top:Math.max(0,s.offsetTop-2),behavior:'smooth'});
}

function advance(spoken){
  const sp=spoken.map(norm).filter(Boolean);if(!sp.length)return;
  for(let n=Math.min(3,sp.length);n>=1;n--){
    const tail=sp.slice(-n);if(n===1&&tail[0].length<4)continue;
    let best=-1;
    for(let i=Math.max(0,pos-3);i<Math.min(words.length,pos+30);i++){
      let ok=true;
      for(let k=0;k<n;k++){const wi=i-(n-1)+k;if(wi<0||words[wi]!==tail[k]){ok=false;break;}}
      if(ok&&(best<0||Math.abs(i+1-pos)<Math.abs(best+1-pos)))best=i;
    }
    if(best>=0){const np=Math.min(best+1,words.length-1);if(np!==pos){pos=np;mark();}return;}
  }
}

function explain(e){
  if(e==='not-allowed'||e==='service-not-allowed'){
    status('El navegador bloqueó el micrófono. Si abriste esto dentro de Claude, la página está en un marco sin permiso: abre el archivo descargado en Chrome, o toca el candado de la barra de direcciones y permite el micrófono.');
  }else status('Error de reconocimiento de voz ('+e+').');
}

/* ---------- cámara y grabación ---------- */
function explainMedia(e){
  const n=e&&e.name||'';
  if(!navigator.mediaDevices){status('Este contexto no permite usar la cámara (se requiere HTTPS).');return;}
  if(n==='NotAllowedError'||n==='SecurityError'){status('El navegador bloqueó la cámara y el micrófono. Toca el candado de la barra de direcciones y permítelos; si abriste esto dentro de otra app, ábrelo en Chrome.');}
  else if(n==='NotFoundError'){status('No se encontró cámara o micrófono.');}
  else if(n==='NotReadableError'){status('La cámara o el micrófono está en uso por otra app.');}
  else status('No se pudo acceder a la cámara ('+(n||e)+').');
}
async function getStream(){
  if(stream)return stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080}},audio:{echoCancellation:true,noiseSuppression:true}});
    $('pip').srcObject=stream;$('pip').style.display=$('seeme').checked?'block':'none';$('pip').play().catch(()=>{});
    return stream;
  }catch(e){explainMedia(e);return null;}
}
function dropStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}$('pip').style.display='none';$('pip').srcObject=null;}
function pickMime(){
  const c=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
  for(const m of c){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;}return '';
}
const LOOKS={natural:'none',bn:'grayscale(1) contrast(1.15)',contraste:'contrast(1.2) saturate(1.1) brightness(1.03)'};
function setPipLook(){$('pip').style.filter=LOOKS[$('look').value]||'none';}
function stopLook(){
  cancelAnimationFrame(lookRaf);lookRaf=0;
  if(lookV){lookV.pause();lookV.srcObject=null;lookV.remove();lookV=null;}
}
async function applyLook(s){
  lookMsg='';
  const f=LOOKS[$('look').value]||'none';
  if(f==='none')return s;
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d');
  if(!ctx||!('filter' in ctx)||!cv.captureStream){lookMsg='Tu navegador no aplica looks al grabar; se grabará en color natural. Usa Chrome para el look.';return s;}
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.srcObject=s;
  v.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none';
  document.body.appendChild(v);lookV=v;
  await v.play();
  if(!v.videoWidth)await new Promise(r=>v.addEventListener('loadedmetadata',r,{once:true}));
  cv.width=v.videoWidth;cv.height=v.videoHeight;
  const draw=()=>{ctx.filter=f;ctx.drawImage(v,0,0,cv.width,cv.height);lookRaf=requestAnimationFrame(draw);};
  draw();
  return new MediaStream([...cv.captureStream(30).getVideoTracks(),...s.getAudioTracks()]);
}
async function startRecording(){
  if(!window.MediaRecorder){status('Tu navegador no admite grabación de video.');return;}
  $('result').style.display='none';
  status('Pidiendo permiso de cámara y micrófono…');
  const s=await getStream();if(!s)return;setPipLook();
  stopVoice();stopAuto();
  pos=0;$('scroller').scrollTop=0;mark();
  status('Prepárate… toca la cuenta para cancelar.');
  const ok=await countdown(+$('cd').value);
  if(!ok){dropStream();status('Cancelado.');return;}
  const mime=pickMime();chunks=[];
  let src=s;try{src=await applyLook(s);}catch(e){stopLook();src=s;}
  try{mr=new MediaRecorder(src,mime?{mimeType:mime,videoBitsPerSecond:8000000}:undefined);}catch(e){stopLook();status('No se pudo iniciar la grabación.');return;}
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  mr.onstop=finishRecording;
  mr.start(1000);
  recStart=Date.now();$('rectag').style.display='block';
  recTimer=setInterval(()=>{const t=Math.floor((Date.now()-recStart)/1000);$('rectag').textContent='● REC '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');},500);
  $('rec').textContent='■ Detener grabación';$('look').disabled=true;
  startRec();status(lookMsg||'Grabando… lee tu guion con normalidad.');
}
function stopRecording(){
  if(mr&&mr.state!=='inactive')mr.stop();
  clearInterval(recTimer);$('rectag').style.display='none';stopLook();stopVoice();stopAuto();
  $('rec').textContent='● Grabar video';$('look').disabled=false;
}
function finishRecording(){
  const type=(mr&&mr.mimeType)||'video/webm';
  lastBlob=new Blob(chunks,{type});
  const ext=type.includes('mp4')?'mp4':'webm';
  lastName='teleprompter-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.'+ext;
  const url=URL.createObjectURL(lastBlob);
  $('playback').src=url;$('dl').href=url;$('dl').download=lastName;
  $('result').style.display='flex';dropStream();
  status('Video listo. Revísalo y descárgalo.');
}

/* ---------- voz ---------- */
function startRec(){
  if(!SR){status('Sin reconocimiento de voz en este navegador. Usa el modo Auto.');return false;}
  stopAuto();
  rec=new SR();rec.lang=$('lang').value;rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';advance(t.trim().split(/\s+/));};
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){wantListen=false;setMic(false);explain(e.error);}
    else if(e.error==='audio-capture'&&mr&&mr.state==='recording'){wantListen=false;setMic(false);startAuto();status('Este teléfono no permite voz y grabación a la vez: cambié al modo Auto mientras grabas.');}
  };
  rec.onend=()=>{if(wantListen){try{rec.start();}catch(_){}}else setMic(false);};
  wantListen=true;
  try{rec.start();setMic(true);return true;}catch(e){status('No se pudo iniciar el reconocimiento de voz.');return false;}
}
function stopVoice(){wantListen=false;if(rec){try{rec.stop();}catch(_){}}setMic(false);}
function setMic(on){listening=on;$('mic').textContent=on?'⏹ Detener':'🎙 Escuchar';}

/* ---------- auto ---------- */
function stopAuto(){autoOn=false;cancelAnimationFrame(raf);$('auto').textContent='▶ Auto';}
function startAuto(){
  stopVoice();autoOn=true;$('auto').textContent='⏸ Pausa';lastT=0;status('Modo Auto: desplazamiento a velocidad fija.');
  const sc=$('scroller');let acc=sc.scrollTop;
  const step=t=>{
    if(!autoOn)return;
    if(lastT){acc+=$('speed').value*(t-lastT)/1000;sc.scrollTop=acc;
      const lim=2+sc.scrollTop;let p=pos;
      while(p<spans.length-1&&spans[p].offsetTop+spans[p].offsetHeight<lim)p++;
      if(p!==pos){pos=p;paint();}}
    lastT=t;raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}

/* ---------- cuenta regresiva ---------- */
function countdown(sec){
  return new Promise(res=>{
    if(!sec){res(true);return;}
    const el=$('count');let n=sec;el.style.display='flex';el.textContent=n;
    cdTimer=setInterval(()=>{n--;if(n<=0){clearInterval(cdTimer);cdTimer=0;el.style.display='none';res(true);}else el.textContent=n;},1000);
    el.onclick=()=>{clearInterval(cdTimer);cdTimer=0;el.style.display='none';res(false);};
  });
}

/* ---------- botones ---------- */
$('go').onclick=()=>{
  if(!$('script').value.trim()){$('script').focus();return;}
  try{localStorage.setItem('tp_script',$('script').value);}catch(e){}
  $('setup').style.display='none';$('run').style.display='flex';build();
};
$('back').onclick=()=>{stopRecording();stopVoice();stopAuto();dropStream();$('run').style.display='none';$('setup').style.display='flex';};
$('mic').onclick=async()=>{
  if(listening){stopVoice();status('Micrófono detenido.');return;}
  status('Prepárate… toca la cuenta para cancelar.');
  const ok=await countdown(+$('cd').value);
  if(!ok){status('Cancelado.');return;}
  if(startRec())status('Escuchando… lee tu guion con normalidad.');
};
$('auto').onclick=async()=>{
  if(autoOn){stopAuto();status('En pausa.');return;}
  status('Prepárate… toca la cuenta para cancelar.');
  const ok=await countdown(+$('cd').value);
  if(!ok){status('Cancelado.');return;}
  startAuto();
};
$('rec').onclick=()=>(mr&&mr.state==='recording')?stopRecording():startRecording();
$('look').onchange=setPipLook;
$('seeme').onchange=()=>{if(stream)$('pip').style.display=$('seeme').checked?'block':'none';};
$('share').onclick=async()=>{
  if(!lastBlob)return;
  try{
    const f=new File([lastBlob],lastName,{type:lastBlob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Mi video'});
    else status('Tu navegador no permite compartir archivos. Usa Descargar.');
  }catch(e){}
};
$('size').oninput=()=>{applySize();mark();};
$('mirror').onchange=e=>$('text').classList.toggle('mirror',e.target.checked);
$('restart').onclick=()=>{pos=0;$('scroller').scrollTop=0;mark();};
$('col').oninput=()=>{document.documentElement.style.setProperty('--col',$('col').value+'%');mark();};
$('sh').oninput=()=>{document.documentElement.style.setProperty('--sh',$('sh').value+'%');mark();};
$('campos').onchange=()=>{const t=$('text'),v=$('campos').value;t.classList.remove('camL','camR');if(v)t.classList.add(v);};
$('fs').onclick=()=>{
  try{
    if(document.fullscreenElement){document.exitFullscreen();return;}
    const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!f){status('Tu navegador no permite pantalla completa aquí.');return;}
    const p=f.call(el);if(p&&p.catch)p.catch(()=>status('Pantalla completa bloqueada. Abre el archivo descargado en Chrome.'));
  }catch(e){status('Pantalla completa bloqueada. Abre el archivo descargado en Chrome.');}
};
})();
</script>
</body>
</html>
